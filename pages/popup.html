<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Detour</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        width: 288px;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 14px 12px;
      }

      .head h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 20px;
        margin: 0;
        flex: 1;
      }

      .status {
        padding: 0 14px 12px;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .status b {
        color: var(--ink);
        font-weight: 600;
      }

      .list {
        max-height: 232px;
        overflow-y: auto;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .list .row {
        padding: 7px 14px;
        font-size: 13px;
      }

      .foot {
        display: flex;
        gap: 6px;
        padding: 10px 14px;
      }

      .foot button {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>Detour</h1>
      <label class="switch" title="Enable Detour">
        <input type="checkbox" id="master" />
        <span class="track"></span>
      </label>
    </div>

    <p class="status" id="status">…</p>

    <div class="list" id="list"></div>

    <div class="foot">
      <button id="pause">Pause 15 min</button>
      <button id="options">Settings</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
